# Ogni 5 minuti chiede a Opifex se c'e' qualcosa da notificare.
# GitHub puo' ritardare i timer di qualche minuto: per questo l'anticipo minimo e' un'ora.
name: Notifiche Opifex
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Controlla scadenze
        env:
          TOKEN: ${{ secrets.OPIFEX_TOKEN }}
        run: |
          curl -sS --max-time 60 -H "x-opifex-token: $TOKEN" https://opifex-rho.vercel.app/api/notify
